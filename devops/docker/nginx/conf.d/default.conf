# /devops/docker/nginx/conf.d/default.conf
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name davomat.uznpu.uz;

    # 🔒 Redirect ALL HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name davomat.uznpu.uz;

    # 🔒 SSL Configuration (Strong ciphers)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 🔒 WAF RULES (Block RCE payloads BEFORE they reach app)
    # Block base64-encoded shell commands
    if ($args ~* "(IyEvYmluL3No|L2Jpbi9zaA==|YmluL3No|ZWNobyB|YmFzaC)"){
        return 403;
    }

    # Block command injection patterns
    if ($args ~* "(\$\(|\$\{|`[^`]*`|;[\s]*(sh|bash|zsh|dash|ksh|nc|wget|curl|python|perl|ruby|php))"){
        return 403;
    }

    # Block path traversal + execution
    if ($args ~* "(\.\.\/.*\.(sh|py|pl|rb|php|exe|js|wasm))"){
        return 403;
    }

    # Block cryptomining signatures
    if ($args ~* "(WebAssembly\.instantiate|CoinHive|CryptoLoot|WebMiner|AuthedMine|monero-miner|webminer|minero|jsecoin)"){
        return 403;
    }

    # Block honeypot paths (trigger immediate block)
    location ~* ^/(wp-login\.php|\.env|\.git|phpmyadmin|admin\.php|actuator/env) {
        return 403;
    }

    # 🔒 RATE LIMITING
    location / {
        limit_req zone=global burst=30 nodelay;
        limit_conn addr 10;

        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 🔒 SECURITY HEADERS (Per-location)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.davomat.uznpu.uz https://davomat.uznpu.uz; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; block-all-mixed-content; upgrade-insecure-requests;" always;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 5;

        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /login {
        limit_req zone=login burst=5 nodelay;  # Strict limit for login

        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 🔒 BLOCK SENSITIVE PATHS
    location ~* ^/(server-status|server-info|phpinfo|\.htaccess|\.env\.backup) {
        deny all;
        return 404;
    }

    # 🔒 STATIC ASSETS (Cache control)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend_upstream;
    }
}