# =========================================================
# 🛡️ NGINX HARDENED CONFIGURATION (INDUSTRIAL GRADE)
# =========================================================

# 1. Rate Limiting Zones (DDoS himoyasi)
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name davomat.uznpu.uz api.davomat.uznpu.uz localhost 127.0.0.1;
    server_tokens off; # Nginx versiyasini yashirish

    # =========================================================
    # 🛡️ 2. BUFFER & TIMEOUTS (Slowloris & Overflow himoyasi)
    # =========================================================
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;

    # Sekin so'rovlarni uzib tashlash
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # =========================================================
    # 🛡️ 3. BLOCK BAD BOTS & SCANNERS
    # =========================================================
    if ($http_user_agent ~* (sqlmap|nikto|nmap|nessus|hydra|burp|acunetix|netsparker|wpscan|dirbuster|gobuster|python-requests|curl|wget|libwww-perl)) {
        return 444; # Connection Closed Without Response
    }

    # =========================================================
    # 🛡️ 4. BLOCK MALICIOUS PAYLOADS (RCE, SQLi, XSS)
    # =========================================================
    # URL yoki Query Stringda xavfli belgilar bo'lsa bloklash
    if ($request_uri ~* "(base64|eval\(|subprocess|popen|exec\(|netcat|nc\s|wget|curl|bash|sh\s|cmd\.exe|powershell)") {
        return 403;
    }

    if ($query_string ~* "(base64|eval\(|subprocess|popen|exec\(|netcat|nc\s|wget|curl|bash|sh\s|cmd\.exe|powershell)") {
        return 403;
    }

    # =========================================================
    # 🛡️ 5. BLOCK SENSITIVE FILES
    # =========================================================
    location ~ /\.(env|git|vscode|idea|svn|hg|DS_Store) {
        deny all;
        return 404;
    }

    location ~ \.(php|sql|bak|log|ini|sh|exe|cgi)$ {
        deny all;
        return 404;
    }

    # =========================================================
    # 🚀 6. FRONTEND PROXY
    # =========================================================
    location / {
        # Rate Limiting qo'llash
        limit_req zone=ip_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://frontend:3000;

        # Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # =========================================================
    # 🚀 7. BACKEND API PROXY
    # =========================================================
    location /api/ {
        # API uchun qattiqroq limit
        limit_req zone=ip_limit burst=10 nodelay;

        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
