# Xavfsizlik qoidalari
x-paranoid-security: &paranoid-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  restart: on-failure:5

# Og'ir yuklamali xizmatlar uchun resurs limitlari
x-deploy-heavy: &deploy-heavy
  resources:
    limits:
      cpus: '2.0'
      memory: 1G
      pids: 100
    reservations:
      memory: 256M

# Yengil xizmatlar uchun resurs limitlari
x-deploy-light: &deploy-light
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
      pids: 100
    reservations:
      memory: 128M

networks:
  public_gateway:
    driver: bridge
  app_tier:
    driver: bridge
  data_vault:
    driver: bridge
    # internal: true  # <-- PyCharm'dan ulanish uchun vaqtincha ochib qo'yildi. Ish bitgach izohni ob tashlang.

volumes:
  pg-data:
  redis-data:

services:
  # 🛡️ THE GATEKEEPER (WAF)
  waf:
    image: nginx:alpine-slim
    container_name: university_waf
    <<: *paranoid-security
    deploy: *deploy-light
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID       # <-- Nginx foydalanuvchini almashtirishi uchun kerak
      - SETGID       # <-- Nginx guruhni almashtirishi uchun kerak
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/run:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - public_gateway
      - app_tier
    sysctls:
      - net.ipv4.tcp_syncookies=1
      - net.ipv4.ip_forward=0

  # 🧠 THE BRAIN (PostgreSQL Timescale)
  db:
    image: timescale/timescaledb:2.15.2-pg16
    container_name: university_db
    <<: *paranoid-security
    deploy: *deploy-heavy
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
      POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
      TZ: "Asia/Tashkent"
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=2GB"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"  # <-- PyCharm'dan ulanish uchun vaqtincha ochildi
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev
    networks:
      - data_vault

  # ⚡ THE CACHE (Redis)
  redis:
    image: redis:7-alpine
    container_name: university_redis
    <<: *paranoid-security
    deploy: *deploy-light
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "10000", "--appendonly", "yes"]
    networks:
      - data_vault

  # 🚀 THE ENGINE (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_api
    <<: *paranoid-security
    deploy: *deploy-heavy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
      POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
      # 🎯 MANA SHU UCHTA QATORNI MAJBURAN BERAMIZ (.env ni bosib o'tish uchun):
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    networks:
      - app_tier
      - data_vault

  # 👷 THE WORKER (Turniket Listener)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_worker
    <<: *paranoid-security
    deploy: *deploy-heavy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
      POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
      # 🎯 MANA SHU UCHTA QATORNI MAJBURAN BERAMIZ:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
    command: ["tini", "--", "python", "backend/worker/redis_streams/main.py"]
    depends_on:
      - redis
      - db
    networks:
      - data_vault
      - app_tier

  # 🌐 THE FACE (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university_frontend
    <<: *paranoid-security
    deploy: *deploy-heavy
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /app/.next/cache:rw,noexec,nosuid,nodev
    networks:
      - app_tier
    depends_on:
      - api