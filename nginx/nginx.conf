# -------------------------------------------------------------------
# 🛡️ THE GATEKEEPER - MILITARY-GRADE NGINX WAF CONFIGURATION
# -------------------------------------------------------------------

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535; # Yuqori yuklamalarda qotib qolmaslik uchun
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. BAZAVIY OPTIMIZATSIYA
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off; # XAVFSIZLIK: Nginx versiyasini xakerlardan yashirish
    keepalive_timeout 15;

    # 2. XOTIRA VA YUKLAMA LIMITLARI (Buffer Overflow hujumlariga qarshi)
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 5M; # FaceID rasm yuklash uchun yetarli, lekin katta viruslarni bloklaydi

    # 3. SLOWLORIS VA DOS HUJUMLARIGA QARSHI TIMEOUTLAR
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # 4. QAT'IY RATE LIMITING (Botnet va DDoS ga qarshi)
    # Bitta IP dan 1 soniyada 20 ta so'rov ruxsat etiladi
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 5. 💥 RCE & MALWARE PAYLOAD KILLER (Aynan sizni buzgan hujumga qarshi)
    # Agar so'rov URL manzilida quyidagi xavfli so'zlar qatnashsa, u bloklanadi.
    map $request_uri $is_malicious {
        default 0;
        "~*(base64|/bin/sh|/bin/bash|wget|curl|IyEvYmlu|nc\s+-e)" 1; # Base64 va Shell komandalar
        "~*(etc/passwd|etc/shadow|.env)" 1;                           # Maxfiy fayllarni o'qishga urinish
        "~*(\$\{.*\}|\$\(.*\))" 1;                                    # Terminal o'zgaruvchilarini ishga tushirish
        "~*(<script|%3Cscript|javascript:)" 1;                        # XSS xujumlar
    }

    # Asosiy Server Bloki
    server {
        listen 80;
        server_name davomat.uznpu.uz localhost; # Barcha domenlar/IPlar uchun

        # 6. HTTP XAVFSIZLIK SARLAVHALARI (Security Headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

        # 7. QAT'IY HTTP METODLARI
        # Faqat GET, POST, PUT, DELETE, OPTIONS ruxsat etiladi. Xakerlarning TRACE/TRACK botlari bloklanadi.
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
            return 405 "Method Not Allowed";
        }

        # 💥 VIRUSNI USHLASH VA O'LDIRISH
        if ($is_malicious = 1) {
            return 403 "Forbidden: Malicious Payload Detected by Gatekeeper";
        }

        # Bitta IP dan bir vaqtning o'zida maksimal 50 ta ulanish
        limit_conn conn_limit 50;

        # ==========================================
        # 🌐 BACKEND API ROUTING (FastAPI)
        # ==========================================
        location /api/ {
            limit_req zone=global_limit burst=20 nodelay;
            
            # FastAPI ga yuborish (docker-compose dagi 'api' xizmati)
            proxy_pass http://api:8000/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API uchun biroz kattaroq timeout (katta so'rovlar uchun)
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ==========================================
        # 🌐 FRONTEND ROUTING (Next.js)
        # ==========================================
        location / {
            limit_req zone=global_limit burst=30 nodelay;
            
            # Next.js ga yuborish (docker-compose dagi 'frontend' xizmati)
            proxy_pass http://frontend:3000/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket qo'llab-quvvatlash (Next.js hot-reload yoki jonli yangilanishlar uchun kerak)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # XAVFSIZLIK: Yopiq fayllarni (.git, .env, .dockerignore) o'qishni taqiqlash
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}