version: "3.9"

x-env: &common-env
  TZ: "Asia/Tashkent"
  PGTZ: "Asia/Tashkent"
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"
  PYTHONUNBUFFERED: "1"
  POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
  POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DB_HOST: db
  DB_PORT: 5432

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  pgbackups:

services:
  # 🟢 PostgreSQL (Timescale + performance tuning)
  db:
    image: timescale/timescaledb:2.15.2-pg16
    container_name: university_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
      POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
      TZ: "Asia/Tashkent"
      PGTZ: "Asia/Tashkent"
    command:
      - postgres
      - -c
      - max_connections=500
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=2GB
      - -c
      - wal_level=replica
      - -c
      - timescaledb.max_background_workers=32
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - shared_preload_libraries=pg_stat_statements,timescaledb
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
    ports:
      - "5436:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Rootdan backend ichidagi db/init ga murojaat
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
      - pgbackups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnikeuser} -d ${POSTGRES_DB:-turnikedb} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]
    logging: *default-logging

  # 🔴 Redis (async caching va task queue)
  redis:
    image: redis:7-alpine
    container_name: university_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "10000", "--appendonly", "yes"]
    networks: [backend]
    logging: *default-logging

  # 💾 Backup (PostgreSQL auto-backup)
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: university_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-turnikedb}
      POSTGRES_USER: ${POSTGRES_USER:-turnikeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecurePass123!}
      BACKUP_NUM_KEEP: 1
      BACKUP_FREQUENCY: daily
      BACKUP_SCHEDULE: "0 0 * * *"
      SCHEDULE_TIMEZONE: Asia/Tashkent
    volumes:
      - pgbackups:/backups
    depends_on:
      - db
    networks: [backend]
    logging: *default-logging

  # 🚀 Backend API (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_api
    restart: unless-stopped
    environment:
      <<: *common-env
    # Alembic migratsiyasini ishga tushirish va keyin API ni yoqish
    # PATH muammosini oldini olish uchun python -m dan foydalanamiz
    command: >
      sh -c "cd backend && python -m alembic upgrade head &&
             python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [backend]
    logging: *default-logging

  # 👷 Worker (Turniket Events Listener)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_worker
    restart: unless-stopped
    environment:
      <<: *common-env
    # Worker uchun maxsus command
    command: ["python", "backend/worker/redis_streams/main.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [backend]
    logging: *default-logging

  # 🌐 Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university_frontend
    restart: unless-stopped
    environment:
      # Browserdan API ga murojaat qilish uchun (public URL)
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [backend]
    logging: *default-logging
