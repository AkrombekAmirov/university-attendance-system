[databases]
# Bu yerda sizning DB nomi va ulanadigan host/port
turnikedb = host=db port=5432 user=turnikeuser password=StrongSecurePass123! dbname=turnikedb

[pgbouncer]
# Asosiy sozlamalar
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /bitnami/pgbouncer/userlist.txt
admin_users = turnikeuser

# Connection pooling rejimi
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 50
reserve_pool_timeout = 5

# Session timeoutlar
server_reset_query = DISCARD ALL
server_idle_timeout = 600
server_lifetime = 3600
query_timeout = 600
client_idle_timeout = 600
server_connect_timeout = 15

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Health monitoring
stats_period = 60
verbose = 0
